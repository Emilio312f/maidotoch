# Integración continua (Plan §3.3): pruebas en cada pull request y en cada integración.
# Ninguna prueba de seguridad alimentaria se omite: si falla una, el pipeline falla.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas (casos críticos de alergias, asistente, pedido, servicios y API Gateway)
        run: ./gradlew test --no-daemon
      - name: Ninguna prueba omitida
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          total = omitidas = 0
          for p in glob.glob("build/pruebas/test-results/test/*.xml"):
              r = ET.parse(p).getroot()
              total += int(r.get("tests")); omitidas += int(r.get("skipped"))
          print(f"{total} pruebas, {omitidas} omitidas")
          sys.exit(1 if omitidas or total == 0 else 0)
          EOF
      - name: Reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-backend
          path: build/pruebas/reports/tests/test

  frontend:
    name: Frontend (web-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Textos es/en
        run: npm test
      - name: Tipos y compilación (web-app del comensal y back-office)
        run: npm run build

  paquete:
    name: Paquete desplegable
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: scripts/empaquetar.sh build/paquete
      - uses: actions/upload-artifact@v4
        with:
          name: paquete
          path: build/paquete/*.tar.gz
          retention-days: 30
